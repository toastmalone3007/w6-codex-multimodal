<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Describer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Image Describer</h1>
    <p class="subtitle">Choose two images and let a local AI model (llava via Ollama) describe each one.</p>

    <section class="card">
      <div class="image-grid">
        <div class="image-slot">
          <label for="imageInput1" class="file-label">Image 1</label>
          <input type="file" id="imageInput1" accept="image/*">
          <div id="preview1" class="preview">
            <p class="placeholder">No image selected yet.</p>
          </div>
        </div>

        <div class="image-slot">
          <label for="imageInput2" class="file-label">Image 2</label>
          <input type="file" id="imageInput2" accept="image/*">
          <div id="preview2" class="preview">
            <p class="placeholder">No image selected yet.</p>
          </div>
        </div>
      </div>

      <button id="describeBtn" type="button">Describe Images</button>

      <p id="status" class="status"></p>
    </section>

    <section class="card">
      <h2>AI Descriptions</h2>
      <div class="result-block">
        <h3>Image 1</h3>
        <div id="result1" class="result">The description of Image 1 will appear here.</div>
      </div>
      <div class="result-block">
        <h3>Image 2</h3>
        <div id="result2" class="result">The description of Image 2 will appear here.</div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
